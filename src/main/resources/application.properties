spring.application.name=smart-drain
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_drain}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Field photos can be larger than Spring Boot's 1 MB multipart default.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=41MB

# MQTT (for sensor readings ingestion)
mqtt.enabled=${MQTT_ENABLED}
mqtt.broker-uri=${MQTT_BROKER_URI}
mqtt.client-id=${MQTT_CLIENT_ID}
mqtt.topic.readings=${MQTT_TOPIC_READINGS}
mqtt.qos=${MQTT_QOS}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
