spring.application.name=smart-drain

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_drain}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.port=8080

# MQTT (for sensor readings ingestion)
mqtt.enabled=${MQTT_ENABLED}
mqtt.broker-uri=${MQTT_BROKER_URI}
mqtt.client-id=${MQTT_CLIENT_ID}
mqtt.topic.readings=${MQTT_TOPIC_READINGS}
mqtt.qos=${MQTT_QOS}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}

# S3 storage
app.storage.s3.region=${S3_REGION}
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.base-url=${S3_BASE_URL}
